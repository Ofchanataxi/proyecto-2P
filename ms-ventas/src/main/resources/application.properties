spring.application.name=ms-ventas
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_ventas}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

app.clients.catalogo.url=${CATALOGO_URL:https://ms-catalogo-d7ilz24p4a-uc.a.run.app/api/medicamentos}
app.clients.inventario.url=${INVENTARIO_URL:https://ms-inventario-d7ilz24p4a-uc.a.run.app/api/inventarios}

# CONFIGURACIÓN OAUTH2 PARA DOCKER

# 1. Identidad Lógica (lo que viene escrito dentro del token desde el navegador)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:https://oauth-server-d7ilz24p4a-uc.a.run.app}

# 2. Ubicación Física (a dónde va el microservicio DENTRO de Docker para pedir las llaves)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://oauth-server-d7ilz24p4a-uc.a.run.app/oauth2/jwks
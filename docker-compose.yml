services:
  # --- Base de Datos Compartida (MySQL) ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-farmacia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # --- Base de Datos OAuth (PostgreSQL) ---
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-oauth
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Microservicio Catálogo ---
  ms-catalogo:
    build: ./ms-catalogo
    container_name: ms-catalogo
    ports:
      - "${CATALOGO_PORT}:8081"
    environment:
      - SERVER_PORT=8081
      - DB_HOST=${MYSQL_HOST}
      - DB_PORT=${MYSQL_PORT}
      - DB_NAME=db_catalogo
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - OAUTH_ISSUER_URI=${OAUTH_URL}
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  # --- Microservicio Inventario ---
  ms-inventario:
    build: ./ms-inventario
    container_name: ms-inventario
    ports:
      - "${INVENTARIO_PORT}:8082"
    environment:
      - SERVER_PORT=8082
      - DB_HOST=${MYSQL_HOST}
      - DB_PORT=${MYSQL_PORT}
      - DB_NAME=db_inventario
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - CATALOGO_URL=${CATALOGO_INTERNAL_URL}/api/medicamentos
      - OAUTH_ISSUER_URI=${OAUTH_URL}
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
    restart: unless-stopped

  # --- Microservicio Ventas ---
  ms-ventas:
    build: ./ms-ventas
    container_name: ms-ventas
    ports:
      - "${VENTAS_PORT}:8083"
    environment:
      - SERVER_PORT=8083
      - DB_HOST=${MYSQL_HOST}
      - DB_PORT=${MYSQL_PORT}
      - DB_NAME=db_ventas
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - CATALOGO_URL=${CATALOGO_INTERNAL_URL}/api/medicamentos
      - INVENTARIO_URL=${INVENTARIO_INTERNAL_URL}/api/inventarios
      - OAUTH_ISSUER_URI=${OAUTH_URL}
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
      ms-inventario:
        condition: service_started
    restart: unless-stopped

  # --- API Gateway ---
  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - SERVER_PORT=8080
      - CATALOGO_URI=${CATALOGO_INTERNAL_URL}
      - INVENTARIO_URI=${INVENTARIO_INTERNAL_URL}
      - VENTAS_URI=${VENTAS_INTERNAL_URL}
      - OAUTH_URI=${OAUTH_INTERNAL_URL}
      - LOG_LEVEL=DEBUG
    depends_on:
      ms-catalogo:
        condition: service_started
      ms-inventario:
        condition: service_started
      ms-ventas:
        condition: service_started
      oauth-server:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Frontend React ---
  ms-frontend:
    build: ./ms-frontend
    container_name: ms-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - VITE_API_GATEWAY_HOST=${GATEWAY_URL}
      - VITE_OIDC_AUTHORITY=${OAUTH_URL}
      - VITE_FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=production
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  # --- Servidor OAuth2 ---
  oauth-server:
    build: ./oauth-server
    container_name: oauth-server
    ports:
      - "${OAUTH_PORT}:9000"
    environment:
      - SERVER_PORT=9000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - OAUTH_ISSUER_URI=${OAUTH_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - postgres-db
    restart: unless-stopped

# --- VOLÚMENES ---
volumes:
  mysql_data:
  postgres_data:

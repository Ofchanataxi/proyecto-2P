services:
  # --- Base de Datos Compartida (MySQL) ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-farmacia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # --- Base de Datos OAuth (PostgreSQL) ---
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-oauth
    restart: always
    environment:
      POSTGRES_DB: db_oauth
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Microservicio Catálogo ---
  ms-catalogo:
    build: ./ms-catalogo
    container_name: ms-catalogo
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=db_catalogo
      - DB_USER=root
      - DB_PASSWORD=admin
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  # --- Microservicio Inventario ---
  ms-inventario:
    build: ./ms-inventario
    container_name: ms-inventario
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=db_inventario
      - DB_USER=root
      - DB_PASSWORD=admin
      - CATALOGO_URL=http://ms-catalogo:8081/api/medicamentos
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
    restart: unless-stopped

  # --- Microservicio Ventas ---
  ms-ventas:
    build: ./ms-ventas
    container_name: ms-ventas
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=db_ventas
      - DB_USER=root
      - DB_PASSWORD=admin
      - CATALOGO_URL=http://ms-catalogo:8081/api/medicamentos
      - INVENTARIO_URL=http://ms-inventario:8082/api/inventarios
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
      ms-inventario:
        condition: service_started
    restart: unless-stopped

  # --- API Gateway ---
  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - CATALOGO_URI=http://ms-catalogo:8081
      - INVENTARIO_URI=http://ms-inventario:8082
      - VENTAS_URI=http://ms-ventas:8083
      - OAUTH_URI=http://oauth-server:9000
      - LOG_LEVEL=DEBUG
    depends_on:
      ms-catalogo:
        condition: service_started
      ms-inventario:
        condition: service_started
      ms-ventas:
        condition: service_started
      oauth-server:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Frontend React ---
  ms-frontend:
    build: ./ms-frontend
    container_name: ms-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_GATEWAY_HOST=http://34.130.32.93:8080
      - NODE_ENV=production
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  # --- Servidor OAuth2 ---
  oauth-server:
    build: ./oauth-server
    container_name: oauth-server
    ports:
      - "9000:9000"
    environment:
      - SERVER_PORT=9000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/db_oauth
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      - postgres-db
    restart: unless-stopped

# --- VOLÚMENES ---
volumes:
  mysql_data:
  postgres_data:

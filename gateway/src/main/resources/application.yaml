server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # 1. Configuración Global de CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # 2. FILTRO MÁGICO: Elimina duplicados si el microservicio también envía CORS
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # 3. Rutas
      routes:
        # OAuth Server - Autenticación
        - id: oauth-server
          uri: ${OAUTH_URI:http://oauth-server:9000}
          predicates:
            - Path=/oauth2/**, /.well-known/**, /login, /logout, /usuarios/**
          filters:
            - PreserveHostHeader

        - id: ms-catalogo
          uri: ${CATALOGO_URI}
          predicates:
            - Path=/api/medicamentos/**
            
        - id: ms-inventario
          uri: ${INVENTARIO_URI}
          predicates:
            - Path=/api/inventarios/**, /api/sucursales/**
            
        - id: ms-ventas
          uri: ${VENTAS_URI}
          predicates:
            - Path=/api/ventas/**
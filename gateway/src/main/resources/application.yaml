spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: ms-auth
          uri: http://ms-auth:8084
          predicates:
            - Path=/api/auth/**

        - id: ms-catalogo
          uri: http://ms-catalogo:8081
          predicates:
            - Path=/api/medicamentos/**

        - id: ms-inventario-sucursales
          uri: http://ms-inventario:8082
          predicates:
            - Path=/api/sucursales/**

        - id: ms-inventario
          uri: http://ms-inventario:8082
          predicates:
            - Path=/api/inventarios/**

        - id: ms-ventas
          uri: http://ms-ventas:8083
          predicates:
            - Path=/api/ventas/**

        - id: ms-ventas-detalles
          uri: http://ms-ventas:8083
          predicates:
            - Path=/api/detalle-ventas/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty.http.client: DEBUG

spring.application.name=ms-auth
server.port=${SERVER_PORT:8084}

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-oauth}:${DB_PORT:5432}/${DB_NAME:oauth_db}
spring.datasource.username=${DB_USER:oauth_user}
spring.datasource.password=${DB_PASSWORD:oauth_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:TuSecretoMuySeguroParaJWTQueDebeSerLargoYComplejo123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=*

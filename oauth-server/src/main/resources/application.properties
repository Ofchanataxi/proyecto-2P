spring.application.name=oauth-server
server.port=9000

# Base de datos (Se conecta a PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres-db:5432/db_oauth
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- CONFIGURACIÓN CRÍTICA PARA GOOGLE CLOUD RUN ---
# Esto obliga a Tomcat a leer los encabezados HTTPS de Google
server.forward-headers-strategy=native
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.internal-proxies=.*

# Logging para ver qué está pasando si falla
logging.level.org.springframework.security=DEBUG

server.servlet.session.cookie.name=OAUTH_SESSIONID
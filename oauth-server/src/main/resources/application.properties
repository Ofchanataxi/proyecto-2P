spring.application.name=oauth-server
server.port=9000

# Base de Datos (Se sobrescribe al desplegar, pero déjalo así)
spring.datasource.url=jdbc:postgresql://postgres-db:5432/db_oauth
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- CONFIGURACIÓN DE PROXY PARA CLOUD RUN (ESTO ES LO QUE TE FALTA) ---
server.forward-headers-strategy=native
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.internal-proxies=.*

# --- FORZAR URL PÚBLICA ---
spring.security.oauth2.authorizationserver.issuer=https://oauth-server-542757597043.us-central1.run.app

logging.level.org.springframework.security=TRACE
server.servlet.session.cookie.name=OAUTH_SESSIONID